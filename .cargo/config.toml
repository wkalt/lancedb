[profile.release]
lto = "fat"
codegen-units = 1

[profile.release-with-debug]
inherits = "release"
debug = true
# Prioritize compile time over runtime performance
codegen-units = 16
lto = "thin"

[profile.release-no-lto]
inherits = "release"
debug = true
lto = false
# Prioritize compile time when LTO is not relevant to the measurement.
codegen-units = 16

[profile.bench]
inherits = "release"
lto = "thin"
codegen-units = 16

[target.'cfg(all())']
rustflags = [
    "-Wclippy::all",
    "-Wclippy::style",
    "-Wclippy::fallible_impl_from",
    "-Wclippy::manual_let_else",
    "-Wclippy::redundant_pub_crate",
    "-Wclippy::string_add_assign",
    "-Wclippy::string_add",
    "-Wclippy::string_lit_as_bytes",
    "-Wclippy::implicit_clone",
    "-Wclippy::use_self",
    "-Dclippy::cargo",
    "-Dclippy::dbg_macro",
    # not too much we can do to avoid multiple crate versions
    "-Aclippy::multiple-crate-versions",
    "-Aclippy::wildcard_dependencies",
]

[target.x86_64-unknown-linux-gnu]
rustflags = ["-C", "target-cpu=haswell", "-C", "target-feature=+avx2,+fma,+f16c"]

[target.x86_64-unknown-linux-musl]
rustflags = ["-C", "target-cpu=haswell", "-C", "target-feature=-crt-static,+avx2,+fma,+f16c"]

[target.aarch64-unknown-linux-musl]
linker = "aarch64-linux-musl-gcc"
rustflags = ["-C", "target-feature=-crt-static"]

[target.aarch64-apple-darwin]
rustflags = ["-C", "target-cpu=apple-m1", "-C", "target-feature=+neon,+fp16,+fhm,+dotprod"]

# Not all Windows systems have the C runtime installed, so this avoids library
# not found errors on systems that are missing it.
[target.x86_64-pc-windows-msvc]
rustflags = ["-Ctarget-feature=+crt-static"]

# Experimental target for Arm64 Windows
[target.aarch64-pc-windows-msvc]
rustflags = ["-Ctarget-feature=+crt-static"]

# Builds against the lance checkout beside this one, so the Python wheel sees
# DataReplacement's new fields before a lance release carries them.
[patch."https://github.com/lance-format/lance.git"]
lance = { path = "../lance/rust/lance" }
lance-arrow = { path = "../lance/rust/lance-arrow" }
lance-core = { path = "../lance/rust/lance-core" }
lance-datafusion = { path = "../lance/rust/lance-datafusion" }
lance-datagen = { path = "../lance/rust/lance-datagen" }
lance-encoding = { path = "../lance/rust/lance-encoding" }
lance-file = { path = "../lance/rust/lance-file" }
lance-index = { path = "../lance/rust/lance-index" }
lance-io = { path = "../lance/rust/lance-io" }
lance-linalg = { path = "../lance/rust/lance-linalg" }
lance-namespace = { path = "../lance/rust/lance-namespace" }
lance-namespace-impls = { path = "../lance/rust/lance-namespace-impls" }
lance-table = { path = "../lance/rust/lance-table" }
lance-testing = { path = "../lance/rust/lance-testing" }
